<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f9"><title>감수분열 · 움직이는 과학</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<header class="topbar"><a class="brand" href="#" aria-label="감수분열 모형 처음으로"><span class="brand-icon">✳</span><span>움직이는 과학<small>MEIOSIS MODEL</small></span></a><div class="view-tools"><button id="mobileView" class="icon-button" aria-pressed="false" title="모바일 화면 전환"><svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10 18.5h4"/></svg><span>모바일</span></button><button id="fullscreen" class="icon-button" title="전체 화면 전환"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span>전체 화면</span></button></div></header>
<section class="model-card"><div class="model-heading"><div><span class="eyebrow">CHROMOSOME JOURNEY</span><h1>감수분열</h1></div><span id="divisionBadge" class="pill">분열 준비</span></div>
<div class="stage-info"><div><span id="stageNo">01 / 10</span><h2 id="stageTitle">간기</h2></div><p id="stageDesc">DNA가 복제됩니다.</p></div>
<div class="canvasWrap"><canvas id="cv" aria-label="감수분열 애니메이션"></canvas><div class="legend"><span><i class="blue"></i>부계</span><span><i class="rose"></i>모계</span><span id="cellCount">2n = 4</span></div></div>
<div class="player"><div class="timeline-caption"><span>분열 과정</span><output id="progressText">0%</output></div><input id="timeline" type="range" min="0" max="10000" step="1" value="0" aria-label="분열 과정 이동"><div class="division-tabs" role="group" aria-label="재생 구간"><button id="playAll" class="selected" aria-pressed="true">전체 과정</button><button id="meiosis1" aria-pressed="false">감수 1분열만</button><button id="meiosis2" aria-pressed="false">감수 2분열만</button></div><div class="playback-row"><div class="playback"><button id="prev" title="이전 단계" aria-label="이전 단계">‹</button><button id="play" class="play-button" aria-label="재생"><span id="playGlyph">▶</span><span id="playText">재생</span></button><button id="next" title="다음 단계" aria-label="다음 단계">›</button></div><label class="label-toggle"><input id="labels" type="checkbox" checked><span>라벨 보기</span></label></div><div class="speed-row"><label for="speed">재생 속도</label><input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="재생 속도"><output id="speedText" for="speed">1.00×</output></div></div>
</section>
<section class="detail-card"><div class="section-caption"><h3>단계 살펴보기</h3><span>버튼으로 이동 · 진행바로 자유롭게 탐색</span></div><div id="stages" class="stages"></div><div class="track"><div><h3>염색체 추적</h3><p>선택한 염색체의 이동을 따라가세요.</p></div><div class="track-buttons"><button data-track="all" class="on" aria-pressed="true">전체</button><button data-track="b1" aria-pressed="false"><i class="blue"></i>부계 1</button><button data-track="r1" aria-pressed="false"><i class="rose"></i>모계 1</button><button data-track="b2" aria-pressed="false"><i class="blue"></i>부계 2</button><button data-track="r2" aria-pressed="false"><i class="rose"></i>모계 2</button></div></div></section><footer>SPACE 재생 / 정지 <span>← → 단계 이동</span></footer>
</main><script src="model.js"></script><script src="meiosis.js"></script></body></html>
