<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><meta name="color-scheme" content="light"><title>동물 감수분열 모형</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<header><div><a class="brand eyebrow" href="#">동물 감수분열 모형</a><h1 id="stageTitle">간기</h1><span id="stageNo" class="sr-only">01 / 10</span></div><div class="head-right"><span id="divisionBadge">분열 준비</span><button id="fullscreen" aria-label="전체 화면 전환">Full ↔ Res.</button></div></header>
<section class="scene" aria-label="감수분열 관찰"><p id="stageDesc" class="sentence">DNA가 복제됩니다.</p><div class="canvasWrap"><canvas id="cv" aria-label="감수분열 애니메이션"></canvas></div></section>
<nav id="stages" class="stages" aria-label="분열 단계"></nav>
<div class="scrub"><input id="timeline" type="range" min="0" max="10000" step="1" value="0" aria-label="분열 과정 이동"><output id="progressText">0%</output></div>
<section class="controls" aria-label="재생 조작"><div class="group"><button id="prev">이전</button><button id="play" class="primary"><span id="playGlyph" aria-hidden="true">▶</span> <span id="playText">재생</span></button><button id="next">다음</button></div><button id="repeat" aria-pressed="false">연달아 재생</button></section>
<div class="observe-row"><div class="division-tabs" role="group" aria-label="재생 구간"><button id="playAll" class="selected" aria-pressed="true">전체 과정</button><button id="meiosis1" aria-pressed="false">감수 1분열만</button><button id="meiosis2" aria-pressed="false">감수 2분열만</button></div><div class="preferences"><label class="label-toggle"><input id="labels" type="checkbox" checked> 라벨 보기</label><label class="speed-row"><span>속도</span><input id="speed" type="range" min="0.25" max="4" step="0.05" value="2" aria-label="재생 속도"><output id="speedText" for="speed">2.00×</output></label></div></div>
<section class="options" aria-label="관찰 도구"><div class="track"><span class="trace-label">염색체 추적</span><div class="track-buttons"><button data-track="all" class="on" aria-pressed="true">전체 보기</button><button data-track="b1" aria-pressed="false">1번 부계</button><button data-track="r1" aria-pressed="false">1번 모계</button><button data-track="b2" aria-pressed="false">2번 부계</button><button data-track="r2" aria-pressed="false">2번 모계</button></div></div><button id="mobileView" aria-pressed="false">모바일 버전</button></section>
<footer>감수분열 모형</footer></main><script src="model.js"></script><script src="meiosis.js"></script></body></html>
