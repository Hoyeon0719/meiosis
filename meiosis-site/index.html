<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>동물 감수분열 모형</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>동물 감수분열 모형</h1><button id="fullscreen">전체 화면</button></header>
<main>
  <section class="info">
    <div id="stageTitle">간기</div>
    <div id="stageDesc">DNA가 복제됩니다.</div>
  </section>

  <div class="canvasWrap"><canvas id="cv"></canvas></div>

  <div id="stages" class="stages"></div>

  <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="진행률">

  <div class="controls">
    <button id="prev">이전</button><button id="play" class="primary">재생</button>
    <button id="next">다음</button><button id="playAll">전체 재생</button>
  </div>
  <div class="controls two">
    <button id="meiosis1">감수 1분열만</button>
    <button id="meiosis2">감수 2분열만</button>
  </div>

  <section class="options">
    <label><input id="daughterOnly" type="checkbox"> 딸세포만 보기</label>
    <label>속도
      <select id="speed">
        <option value=".25">0.25×</option><option value=".5">0.5×</option>
        <option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
      </select>
    </label>
    <label><input id="labels" type="checkbox" checked> 라벨 표시</label>
  </section>

  <section class="track">
    <b>염색체 추적</b>
    <button data-track="all" class="on">전체</button>
    <button data-track="b1">1번 부계</button><button data-track="r1">1번 모계</button>
    <button data-track="b2">2번 부계</button><button data-track="r2">2번 모계</button>
  </section>
</main>
<script src="meiosis.js"></script>
</body>
</html>
